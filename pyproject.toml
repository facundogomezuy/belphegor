[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "belphegor"
version = "0.1.0"
description = "Recon & enumeration toolkit para bug bounty y pentesting"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Facundo Gómez" }]
keywords = ["pentesting", "bug-bounty", "recon", "enumeration", "gobuster", "security"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0.0",
    "pyfiglet>=1.0.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/facundogomezuy/belphegor"
Repository = "https://github.com/facundogomezuy/belphegor"

# Esto es lo que crea el comando `belphegor` en el PATH: al instalar el paquete,
# se genera un ejecutable que llama a belphegor.cli:main.
[project.scripts]
belphegor = "belphegor.cli:main"

[tool.setuptools.packages.find]
include = ["belphegor*"]
